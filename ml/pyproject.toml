[project]
name = "chessml"
version = "0.1.0"
description = "Learns to predict the move a human chess player would play"
requires-python = ">=3.10"
dependencies = ["torch>=2.2", "chess>=1.10", "numpy>=1.24", "zstandard>=0.22"]

[project.optional-dependencies]
dev = ["pytest>=8"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
